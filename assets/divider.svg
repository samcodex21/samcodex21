<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="78" viewBox="0 0 1280 78" role="img" aria-labelledby="title">
  <title id="title">Black and gold Sam Codex section divider</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0B0D" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#7A5A12" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#F5D879"/>
      <stop offset="0.82" stop-color="#7A5A12" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0B0B0D" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-80%" width="110%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="78" fill="#0B0B0D" fill-opacity="0"/>
  <path d="M64 39H1216" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>
</svg>
