<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420" role="img" aria-labelledby="title desc">
  <title id="title">Sam Codex GitHub Metrics</title>
  <desc id="desc">Black and gold metrics dashboard fallback before the metrics workflow writes live data.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5D879"/>
      <stop offset="0.5" stop-color="#D6AF36"/>
      <stop offset="1" stop-color="#7A5A12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="740" height="420" rx="22" fill="#08080A"/>
  <rect x="32" y="32" width="676" height="356" rx="18" fill="#111114" stroke="#D6AF36" stroke-opacity="0.48"/>
  <circle cx="612" cy="92" r="150" fill="#D6AF36" opacity="0.08"/>
  <path d="M76 128H664M76 212H664M76 296H664" stroke="#D6AF36" stroke-opacity="0.12"/>
  <text x="76" y="96" fill="url(#gold)" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800" filter="url(#glow)">Sam Codex Metrics</text>
  <text x="76" y="146" fill="#F5F2E8" font-family="Consolas, monospace" font-size="17">workflow: lowlighter/metrics</text>
  <text x="76" y="190" fill="#D6AF36" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">AI Automation • SaaS • Open Source</text>
  <text x="76" y="256" fill="#F5F2E8" fill-opacity="0.78" font-family="Segoe UI, Arial, sans-serif" font-size="18">Live contribution, language, repository, and activity metrics are generated automatically.</text>
  <rect x="76" y="326" width="420" height="10" rx="5" fill="url(#gold)" filter="url(#glow)"/>
</svg>
