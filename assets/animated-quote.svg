<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="190" viewBox="0 0 1180 190" role="img" aria-labelledby="title desc">
  <title id="title">Animated Developer Quote</title>
  <desc id="desc">Animated black and gold quote card for Sam Codex.</desc>
  <defs>
    <linearGradient id="shine" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7A5A12"/>
      <stop offset="0.5" stop-color="#F5D879"/>
      <stop offset="1" stop-color="#D6AF36"/>
      <animate attributeName="x1" values="-1;0;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1180" height="190" rx="22" fill="#08080A"/>
  <rect x="32" y="32" width="1116" height="126" rx="18" fill="#111114" stroke="#D6AF36" stroke-opacity="0.46"/>
  <text x="590" y="90" text-anchor="middle" fill="url(#shine)" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">"The best way to predict the future is to build it."</text>
  <text x="590" y="126" text-anchor="middle" fill="#F5F2E8" fill-opacity="0.75" font-family="Consolas, monospace" font-size="17">Sam Codex • AI Automation Engineer</text>
</svg>
