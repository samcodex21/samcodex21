<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="84" viewBox="0 0 1180 84" role="img" aria-labelledby="title">
  <title id="title">Animated Black and Gold Gradient</title>
  <defs>
    <linearGradient id="gradient" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#0B0B0D"/>
      <stop offset="0.35" stop-color="#7A5A12"/>
      <stop offset="0.5" stop-color="#F5D879"/>
      <stop offset="0.65" stop-color="#D6AF36"/>
      <stop offset="1" stop-color="#0B0B0D"/>
      <animate attributeName="x1" values="-1;0;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1180" height="84" rx="18" fill="#08080A"/>
  <rect x="40" y="36" width="1100" height="12" rx="6" fill="url(#gradient)"/>
  <text x="590" y="28" text-anchor="middle" fill="#F5F2E8" fill-opacity="0.72" font-family="Consolas, monospace" font-size="15">premium automation layer</text>
</svg>
