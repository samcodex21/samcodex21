<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Sam Codex About Me VS Code Section</title>
  <desc id="desc">A dark VS Code style TypeScript class containing role, mission, focus, currently building, tech, and motto.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5D879"/>
      <stop offset="0.45" stop-color="#D6AF36"/>
      <stop offset="1" stop-color="#7A5A12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1180" height="560" rx="24" fill="#08080A"/>
  <circle cx="970" cy="96" r="210" fill="#D6AF36" opacity="0.08"/>
  <circle cx="180" cy="470" r="190" fill="#D6AF36" opacity="0.06"/>
  <rect x="26" y="26" width="1128" height="508" rx="20" fill="#111114" stroke="url(#border)" stroke-width="2"/>
  <rect x="26" y="26" width="1128" height="54" rx="20" fill="#17171B"/>
  <path d="M26 80H1154" stroke="#D6AF36" stroke-opacity="0.28"/>
  <circle cx="58" cy="53" r="7" fill="#ff5f57"/>
  <circle cx="82" cy="53" r="7" fill="#ffbd2e"/>
  <circle cx="106" cy="53" r="7" fill="#28c840"/>
  <rect x="152" y="36" width="178" height="35" rx="10" fill="#0B0B0D" stroke="#D6AF36" stroke-opacity="0.34"/>
  <text x="178" y="59" fill="#F5F2E8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">SamCodex.ts</text>
  <rect x="26" y="80" width="72" height="454" fill="#0D0D10"/>
  <path d="M98 80V534" stroke="#D6AF36" stroke-opacity="0.16"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="22">
    <text x="50" y="126" fill="#6F737A">01</text>
    <text x="50" y="166" fill="#6F737A">02</text>
    <text x="50" y="206" fill="#6F737A">03</text>
    <text x="50" y="246" fill="#6F737A">04</text>
    <text x="50" y="286" fill="#6F737A">05</text>
    <text x="50" y="326" fill="#6F737A">06</text>
    <text x="50" y="366" fill="#6F737A">07</text>
    <text x="50" y="406" fill="#6F737A">08</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="24">
    <text x="124" y="126"><tspan fill="#C586C0">class</tspan><tspan fill="#4EC9B0"> SamCodex</tspan><tspan fill="#D4D4D4"> {</tspan></text>
    <text x="160" y="166"><tspan fill="#9CDCFE">role</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#CE9178">"AI Automation Engineer"</tspan><tspan fill="#D4D4D4">;</tspan></text>
    <text x="160" y="206"><tspan fill="#9CDCFE">mission</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#CE9178">"Build intelligent systems that automate work and scale impact."</tspan><tspan fill="#D4D4D4">;</tspan></text>
    <text x="160" y="246"><tspan fill="#9CDCFE">focus</tspan><tspan fill="#D4D4D4"> = [</tspan><tspan fill="#CE9178">"AI agents"</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#CE9178">"SaaS"</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#CE9178">"RAG"</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#CE9178">"automation"</tspan><tspan fill="#D4D4D4">];</tspan></text>
    <text x="160" y="286"><tspan fill="#9CDCFE">currentlyBuilding</tspan><tspan fill="#D4D4D4"> = [</tspan><tspan fill="#CE9178">"Personal IDE"</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#CE9178">"Ultimate RAG Agent"</tspan><tspan fill="#D4D4D4">];</tspan></text>
    <text x="160" y="326"><tspan fill="#9CDCFE">tech</tspan><tspan fill="#D4D4D4"> = [</tspan><tspan fill="#CE9178">"TypeScript"</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#CE9178">"Python"</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#CE9178">"FastAPI"</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#CE9178">"Docker"</tspan><tspan fill="#D4D4D4">];</tspan></text>
    <text x="160" y="366"><tspan fill="#9CDCFE">motto</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#CE9178">"Build • Automate • Scale • Impact"</tspan><tspan fill="#D4D4D4">;</tspan></text>
    <text x="124" y="406" fill="#D4D4D4">}</text>
  </g>
  <g filter="url(#glow)">
    <path d="M782 440H1088" stroke="#D6AF36" stroke-opacity="0.65"/>
    <circle cx="914" cy="440" r="5" fill="#D6AF36"/>
    <circle cx="1018" cy="440" r="5" fill="#F5D879"/>
