<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="120" viewBox="0 0 1280 120" role="img" aria-labelledby="title desc">
  <title id="title">Animated Sam Codex Header</title>
  <desc id="desc">Animated black and gold profile header.</desc>
  <defs>
    <linearGradient id="gold" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7A5A12"/>
      <stop offset="0.5" stop-color="#F5D879"/>
      <stop offset="1" stop-color="#D6AF36"/>
      <animate attributeName="x1" values="-1;0;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="120" fill="#08080A"/>
  <path d="M96 60H1184" stroke="url(#gold)" stroke-width="2" filter="url(#glow)"/>
  <text x="640" y="52" text-anchor="middle" fill="url(#gold)" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800">SAM CODEX</text>
  <text x="640" y="84" text-anchor="middle" fill="#F5F2E8" fill-opacity="0.76" font-family="Consolas, monospace" font-size="16">AI Automation Engineer • SaaS Builder • Open Source</text>
  <circle cx="96" cy="60" r="5" fill="#D6AF36"><animate attributeName="opacity" values="0.25;1;0.25" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1184" cy="60" r="5" fill="#D6AF36"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
</svg>
